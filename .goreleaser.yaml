version: 2

project_name: sealclub

before:
  hooks:
    - go mod tidy

builds:
  - id: sealclub
    main: ./cmd/sealclub
    binary: sealclub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Homebrew formula is maintained in sealdotclub/homebrew-tap.
# Auto-push requires a HOMEBREW_TAP_GITHUB_TOKEN with write access to that repo.
